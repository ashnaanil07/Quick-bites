name: Continuous Integration

# 1. Define what events trigger this workflow
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

# 2. Define the execution environment and sequential commands
jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest # The virtual operating system running the runner agent

    steps:
      # Step 1: Fetch the codebase repository onto the runner machine
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Establish the runtime language environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically handles caching to speed up subsequent workflow steps

      # Step 3: Clean install project dependencies based on the lockfile
      - name: Install Dependencies
        run: npm ci

      # Step 4: Compile/Verify project builds (optional but recommended for compiled languages)
      - name: Build Application
        run: npm run build --if-present

      # Step 5: Execute automated unit, integration, or lint tests
      - name: Run Tests
        run: npm test